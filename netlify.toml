# Configuración de Despliegue Monolítico en Netlify (Client React/Vite + Server Express Serverless)
[build]
  base = "/"
  command = "cd server && npm install && cd ../client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

# Redirigir todas las llamadas a /api/* hacia la Netlify Function del backend Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Fallback SPA para React Router (cualquier ruta del frontend devuelve index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

